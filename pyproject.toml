[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrogit-os"
version = "0.2.0"
description = "Declarative architecture and operational lineage for astronomical instrumentation via GitOps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Pablo Zúñiga", email = "pablo@cuxhavenlabs.com" }
]
keywords = ["astronomy", "gitops", "infrastructure-as-code", "observatory-operations", "polars"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "astropy>=8.0.0",
    "polars>=1.44.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.0",
    "PyYAML>=6.0.0",
    "GitPython>=3.1.0",
]

[project.urls]
Homepage = "https://github.com"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
